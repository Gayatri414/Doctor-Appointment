name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Create temporary .env file in the backend folder so docker-compose build can use it
    - name: Create Backend Env File from Secrets
      run: |
        echo "PORT=4000" >> backend/.env
        echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> backend/.env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
        echo "CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}" >> backend/.env
        echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> backend/.env
        echo "CLOUDINARY_API_SECRET_KEY=${{ secrets.CLOUDINARY_API_SECRET_KEY }}" >> backend/.env
        echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> backend/.env
        echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> backend/.env
        echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> backend/.env
        echo "VITE_ADMIN_PANEL_URL=${{ secrets.VITE_ADMIN_PANEL_URL }}" >> backend/.env

    - name: Verify Docker Compose Config
      run: docker compose config

    - name: Build with Docker Compose (CI Verification)
      run: docker compose build --parallel

    # The following steps run on push to main/master to deploy/push to Docker Hub (CD)
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Image
      if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/prescripto-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/prescripto-backend:${{ github.sha }}

    - name: Build and Push Frontend Image
      if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        build-args: |
          VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
          VITE_ADMIN_PANEL_URL=${{ secrets.VITE_ADMIN_PANEL_URL }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/prescripto-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/prescripto-frontend:${{ github.sha }}

    - name: Build and Push Admin Image
      if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
      uses: docker/build-push-action@v5
      with:
        context: ./admin
        file: ./admin/Dockerfile
        push: true
        build-args: |
          VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/prescripto-admin:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/prescripto-admin:${{ github.sha }}
