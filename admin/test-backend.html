<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testBackend()">Test Backend Connection</button>
    <div id="result"></div>

    <script>
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            
            try {
                // Test basic connection
                const response = await fetch('http://localhost:4000/');
                const text = await response.text();
                
                resultDiv.innerHTML = `
                    <h3>Backend Response:</h3>
                    <p>Status: ${response.status}</p>
                    <p>Response: ${text}</p>
                `;
                
                // Test admin login
                const loginResponse = await fetch('http://localhost:4000/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@prescripto.com',
                        password: 'gayatri123'
                    })
                });
                
                const loginData = await loginResponse.json();
                
                resultDiv.innerHTML += `
                    <h3>Admin Login Test:</h3>
                    <p>Status: ${loginResponse.status}</p>
                    <p>Response: ${JSON.stringify(loginData, null, 2)}</p>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error:</h3>
                    <p style="color: red;">${error.message}</p>
                    <p>Make sure the backend server is running on port 4000</p>
                `;
            }
        }
    </script>
</body>
</html>
